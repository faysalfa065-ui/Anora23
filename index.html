              min={30}
              max={240}
              step={10}
              value={maxRuntime}
              onChange={(e) => setMaxRuntime(Number(e.target.value))}
              className="w-full accent-[#F5C518]"
            />
          </div>

          {/* Language & Sort */}
          <div className="grid grid-cols-2 gap-2">
            <div>
              <label className="block text-[10px] font-bold text-zinc-400 mb-1">Language</label>
              <select
                value={language}
                onChange={(e) => setLanguage(e.target.value)}
                aria-label="Filter Language"
                className="w-full px-2.5 py-1.5 rounded-lg bg-black border border-white/15 text-xs text-white"
              >
                <option value="all">All</option>
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="ko">Korean</option>
                <option value="ja">Japanese</option>
              </select>
            </div>
            <div>
              <label className="block text-[10px] font-bold text-zinc-400 mb-1">Sort By</label>
              <select
                value={sortBy}
                onChange={(e) => setSortBy(e.target.value as any)}
                aria-label="Sort Discover"
                className="w-full px-2.5 py-1.5 rounded-lg bg-black border border-white/15 text-xs text-white"
              >
                <option value="popularity.desc">Popularity</option>
                <option value="vote_average.desc">Top Rated</option>
                <option value="release_date.desc">Newest</option>
              </select>
            </div>
          </div>

          {/* Save Filter Preset */}
          <form onSubmit={handleCreatePreset} className="pt-3 border-t border-white/10 space-y-2">
            <label className="block text-[11px] font-bold text-zinc-300">
              Save Current Filter Preset
            </label>
            <div className="flex gap-1.5">
              <input
                type="text"
                value={presetName}
                onChange={(e) => setPresetName(e.target.value)}
                placeholder="Preset name..."
                className="flex-1 px-2.5 py-1.5 rounded-lg bg-black border border-white/15 text-xs text-white"
              />
              <button
                type="submit"
                className="px-3 py-1.5 rounded-lg bg-[#F5C518] text-black text-xs font-black"
              >
                Save
              </button>
            </div>
          </form>

          {savedPresets.length > 0 && (
            <div className="space-y-1.5">
              <div className="text-[10px] font-bold uppercase text-zinc-400">Saved Presets</div>
              {savedPresets.map((p) => (
                <div
                  key={p.id}
                  className="flex items-center justify-between px-2.5 py-1.5 rounded-lg bg-black/60 border border-white/10 text-xs"

                  <button

                    onClick={() => applyPreset(p)}
                    className="font-bold text-[#F5C518] hover:underline truncate flex items-center gap-1"

                    <Bookmark className="w-3 h-3" /> {p.name}
                  </button>
                  <button
                    type="button"
                    onClick={() => onDeletePreset(p.id)}
                    aria-label={`Delete preset ${p.name}`}
                    className="text-zinc-500 hover:text-red-400"
                  >
                    <Trash2 className="w-3.5 h-3.5" />
                  </button>
                </div>
              ))}
            </div>
          )}
        </aside>

        {/* Discover Grid */}
        <div className="flex-1 space-y-4">
          <div className="flex items-center justify-between">
            <h1 className="text-lg sm:text-xl font-black text-white">
              Discover Catalog ({filtered.length} Titles)
            </h1>
          </div>

          <div className="flex flex-wrap gap-3.5 justify-center sm:justify-start">
            {filtered.map((item) => {
              const key = `${item.media_type}-${item.id}`;
              const inList = watchlist.some(
                (w) => w.mediaId === item.id && w.mediaType === item.media_type
              );
              return (
                <MediaCard
                  key={key}
                  item={item}
                  imageQuality={imageQuality}
                  inWatchlist={inList}
                  userRating={ratings[key]?.rating}
                  userThumb={ratings[key]?.thumb}
                  onSelect={onSelectMedia}
                  onToggleWatchlist={onToggleWatchlist}
                  onQuickRate={onQuickRate}
                />
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
};

    (r) => r.rating >= 8 || r.thumb === 'love' || r.thumb === 'like'
  );

  // Derive top favorite genres
  const genreCounts: Record<number, number> = {};
  profile.watchlist.forEach((w) =>
    w.genre_ids.forEach((g) => {
      genreCounts[g] = (genreCounts[g] || 0) + 1;
    })
  );
  ratingEntries.forEach((r) =>
    r.genre_ids.forEach((g) => {
      genreCounts[g] = (genreCounts[g] || 0) + 2;

  );
  const topGenreNames = Object.entries(genreCounts)
    .sort((a, b) => b[1] - a[1])

    const headers = ['Title,Type,Year,Rating,Watched,AddedAt'];

        `"${w.title.replace(/"/g, '""')}",${w.mediaType},${w.year},${w.vote_average},${w.watched},${w.addedAt}`
    );
    const csv = [...headers, ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `anora-watchlist-${profile.name.toLowerCase()}.csv`;
    a.click();
    URL.revokeObjectURL(url);

              </span>
            </div>
          </div>

                    <div className="aspect-[2/3] relative">
                      <img
                        src={getTmdbImageUrl(r.poster_path || media.poster_path, imageQuality, r.title)}

                        className="w-full h-full object-cover"

                      </span>
                    </div>
                    <div className="p-2 text-xs font-bold text-white truncate">{r.title}</div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        <div className="space-y-4">

            <div className="flex items-center gap-1.5">
              {(['all', 'unwatched', 'watched'] as const).map((f) => (

                  type="button"
                  onClick={() => setWatchlistFilter(f)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold capitalize ${
                    watchlistFilter === f ? 'bg-white text-black' : 'bg-[#141416] text-zinc-300'
                  }`}
                >
                  {f}
                </button>
              ))}

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={handleExportWatchlistCsv}

              >
                <Download className="w-3.5 h-3.5" />
                <span>Export CSV</span>
              </button>
              <button
                type="button"
                onClick={() => setWatchlistView((v) => (v === 'grid' ? 'list' : 'grid'))}
                className="p-2 rounded-xl bg-[#141416] border border-white/10 text-white"
                aria-label="Toggle Grid or List view"
              >
                {watchlistView === 'grid' ? <ListIcon className="w-4 h-4" /> : <Grid className="w-4 h-4" />}

            </div>
          </div>

          <div
            className={
              watchlistView === 'grid'
                ? 'grid grid-cols-2 sm:grid-cols-4 gap-4'

          >
            {profile.watchlist
              .filter((w) => {
                if (watchlistFilter === 'watched') return w.watched;
                if (watchlistFilter === 'unwatched') return !w.watched;
                return true;
              })
              .map((w) => {
                const media = resolveMedia(w.mediaId, w.mediaType);
                return (
                  <div
                    key={`${w.mediaType}-${w.mediaId}`}
                    className="p-3 rounded-2xl bg-[#141416] border border-white/10 flex flex-col justify-between gap-3"

                    <div
                      onClick={() => onSelectMedia(media)}
                      className="flex items-center gap-3 cursor-pointer"

                      <img
                        src={getTmdbImageUrl(w.poster_path || media.poster_path, 'w500', w.title)}

                        className="w-14 h-20 rounded-xl object-cover shrink-0"
                      />

                        <div className="text-xs font-black text-white truncate">{w.title}</div>
                        <div className="text-[11px] text-zinc-400">
                          {w.year} • ★ {w.vote_average.toFixed(1)}

                        <span
                          className={`inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-bold ${

                        type="button"
                        onClick={() => onToggleWatched(w.mediaId, w.mediaType)}

                      >
                        <Eye className="w-3 h-3" />
                        <span>{w.watched ? 'Mark Unwatched' : 'Mark Watched'}</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => onRemoveWatchlist(w.mediaId, w.mediaType)}
                        aria-label={`Remove ${w.title}`}
                        className="p-1.5 rounded-lg bg-red-500/15 text-red-400 hover:bg-red-500/25"
                      >
                        <Trash2 className="w-3.5 h-3.5" />

                    </div>
                  </div>

      {/* SECTION 3: Ratings & Reviews */}
      {section === 'ratings' && (
        <div className="space-y-4">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            {ratingEntries.map((r) => {
              const media = resolveMedia(r.mediaId, r.mediaType);
              return (
                <div
                  key={`${r.mediaType}-${r.mediaId}`}
                  onClick={() => onSelectMedia(media)}
                  className="p-4 rounded-2xl bg-[#141416] border border-white/10 hover:border-[#F5C518] flex items-center justify-between cursor-pointer"

                  <div>
                    <div className="text-sm font-black text-white">{r.title}</div>
                    <div className="text-xs text-zinc-400">{r.year}</div>
                  </div>

                    <span className="px-3 py-1 rounded-xl bg-[#F5C518] text-black font-black text-xs">
                      ★ {r.rating}/10
                    </span>
                  </div>
                </div>
              );
            })}
          </div>

          <h3 className="text-sm font-black uppercase text-zinc-400 pt-2">Your Written Reviews</h3>
          <div className="space-y-3">
            {profile.reviews.map((rev) => (
              <div
                key={rev.id}
                className="p-4 rounded-2xl bg-[#141416] border border-white/10 flex items-start justify-between gap-4"

                <div className="space-y-1">
                  <div className="text-xs font-bold text-[#F5C518]">
                    {rev.mediaTitle} ({rev.mediaYear}) • ★ {rev.rating}/10

        <div className="space-y-5">
          <form
            onSubmit={(e) => {
              e.preventDefault();
              if (!newListName.trim()) return;
              onCreateList(newListName.trim(), newListDesc.trim() || 'Curated collection');

            <input
              type="text"
              value={newListDesc}
              onChange={(e) => setNewListDesc(e.target.value)}

              className="flex-1 px-3.5 py-2 rounded-xl bg-black border border-white/15 text-xs text-white"

            <button
              type="submit"
              className="px-5 py-2 rounded-xl bg-[#F5C518] text-black text-xs font-black flex items-center justify-center gap-1.5"

              <span>Create List</span>
            </button>
          </form>

          <div className="space-y-4">

              <div
                key={list.id}
                className="p-5 rounded-2xl bg-[#141416] border border-white/10 space-y-3"
              >
                <div className="flex items-start justify-between">
                  <div>
                    <h4 className="text-base font-black text-white">{list.name}</h4>
                    <p className="text-xs text-zinc-400">{list.description}</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => onDeleteList(list.id)}
                    aria-label={`Delete list ${list.name}`}
                    className="p-1.5 rounded-lg text-zinc-400 hover:text-red-400"
                  >
                    <Trash2 className="w-4 h-4" />
                  </button>
                </div>

                <div className="flex gap-3 overflow-x-auto pb-1 no-scrollbar">
                  {list.items.map((item) => {
                    const media = resolveMedia(item.mediaId, item.mediaType);
                    return (
                      <button
                        key={`${item.mediaType}-${item.mediaId}`}
                        type="button"
                        onClick={() => onSelectMedia(media)}
                        className="w-32 shrink-0 rounded-xl overflow-hidden bg-black/50 border border-white/10 text-left"
                      >
                        <div className="aspect-[2/3]">
                          <img
                            src={getTmdbImageUrl(item.poster_path || media.poster_path, 'w500', item.title)}
                            alt={item.title}
                            className="w-full h-full object-cover"
                          />
                        </div>
                        <div className="p-2 text-[11px] font-bold text-white truncate">
                          {item.title}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* SECTION 5: Watch History */}
      {section === 'history' && (
        <div className="space-y-4">
          <div className="flex items-center justify-between">
            <h3 className="text-base font-black text-white">Recently Viewed & Played</h3>
            {profile.watchHistory.length > 0 && (
              <button
                type="button"
                onClick={onClearHistory}
                className="px-3.5 py-1.5 rounded-xl bg-red-500/15 text-red-300 text-xs font-bold"
              >
                Clear Watch History
              </button>
            )}
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {profile.watchHistory.map((h) => {
              const media = resolveMedia(h.mediaId, h.mediaType);
              return (
                <div
                  key={`${h.mediaType}-${h.mediaId}`}
                  onClick={() => onSelectMedia(media)}
                  className="p-3.5 rounded-2xl bg-[#141416] border border-white/10 flex items-center justify-between cursor-pointer hover:border-[#F5C518]"
                >
                  <div>
                    <div className="text-sm font-black text-white">{h.title}</div>
                    <div className="text-xs text-zinc-400">
                      {h.lastEpisode} • {h.progressPercent}% complete
                    </div>
                  </div>
                  <span className="text-xs font-bold text-[#F5C518]">Resume →</span>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
};

  profile: ProfileData;
  settings: AppSettings;
  onUpdateSettings: (partial: Partial<AppSettings>) => void;
  onUpdateAccount: (name: string, email: string) => void;
  onUpdateProfile: (name: string, avatarId: string, isKids: boolean) => void;
  onTogglePreferredProvider: (providerId: number) => void;
  onExportAllJson: () => void;
  onClearWatchHistory: () => void;
  onClearRatings: () => void;
  onResetAllData: () => void;
  onSignOut: () => void;
  onRerunOnboarding: () => void;
  onNotify: (msg: string) => void;
}

const SettingsPage: React.FC<SettingsPageProps> = ({
  account,
  profile,
  settings,
  onUpdateSettings,
  onUpdateAccount,
  onUpdateProfile,
  onTogglePreferredProvider,
  onExportAllJson,
  onClearWatchHistory,
  onClearRatings,
  onResetAllData,
  onSignOut,
  onRerunOnboarding,
  onNotify,
}) => {
  const [apiKeyInput, setApiKeyInput] = useState(settings.tmdbApiKey);
  const [testingKey, setTestingKey] = useState(false);
  const [validationMsg, setValidationMsg] = useState<string>(
    settings.tmdbKeyStatus === 'valid'
      ? '✅ Connected to TMDB API (/configuration verified)'
      : settings.tmdbKeyStatus === 'invalid'
      ? '❌ Invalid TMDB API key — using Seed Demo Catalog'
      : 'No key configured — Seed Demo Mode active'
  );

  const [accName, setAccName] = useState(account?.name || profile.name);
  const [accEmail, setAccEmail] = useState(account?.email || 'arin@anora.cinema');
  const [profName, setProfName] = useState(profile.name);
  const [profAvatar, setProfAvatar] = useState(profile.avatarId);
  const [profKids, setProfKids] = useState(profile.isKids);
  const [confirmResetModal, setConfirmResetModal] = useState(false);

  const cacheStats = getTmdbCacheStats();

  const handleValidateAndSaveKey = async () => {
    setTestingKey(true);
    const result = await validateTmdbApiKey(apiKeyInput);
    setTestingKey(false);
    if (result.valid) {
      onUpdateSettings({
        tmdbApiKey: apiKeyInput.trim(),
        tmdbKeyStatus: 'valid',
        tmdbKeyLastChecked: new Date().toISOString(),
      });
      setValidationMsg(`✅ Connected (${result.message})`);
      onNotify('TMDB API Key validated and saved!');
    } else {
      onUpdateSettings({
        tmdbApiKey: apiKeyInput.trim(),
        tmdbKeyStatus: apiKeyInput.trim() ? 'invalid' : 'untested',
      });
      setValidationMsg(`❌ ${result.message}`);
      onNotify(result.message);
    }
  };

  const handleClearKey = () => {
    setApiKeyInput('');
    onUpdateSettings({ tmdbApiKey: '', tmdbKeyStatus: 'untested' });
    setValidationMsg('API key cleared — running in Seed Demo Mode.');
    onNotify('Cleared TMDB API key.');
  };

  return (
    <div className="max-w-4xl mx-auto px-4 sm:px-6 py-6 pb-28 space-y-6">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <span className="text-xs font-extrabold uppercase tracking-wider text-[#F5C518]">
            Control Center
          </span>
          <h1 className="text-2xl sm:text-3xl font-black text-white">
            Settings & TMDB Configuration
          </h1>
        </div>
        <button
          type="button"
          onClick={onSignOut}
          className="px-4 py-2 rounded-xl bg-red-500/15 hover:bg-red-500/25 border border-red-500/30 text-xs font-bold text-red-300 flex items-center gap-1.5"
        >
          <LogOut className="w-4 h-4" />
          <span>Sign Out</span>
        </button>
      </div>

      {/* SECTION 2 (Highlighted First for Immediate Access): TMDB API Key Integration */}
      <section className="p-5 sm:p-6 rounded-2xl bg-[#141416] border-2 border-[#F5C518]/50 shadow-xl space-y-4">
        <div className="flex items-start justify-between gap-3">
          <div className="flex items-center gap-2.5">
            <div className="w-9 h-9 rounded-xl bg-[#F5C518] text-black flex items-center justify-center font-black">
              <Key className="w-5 h-5" />
            </div>
            <div>
              <h2 className="text-base sm:text-lg font-black text-white">
                TMDB API Key (v3 Key or v4 Bearer Token)
              </h2>
              <p className="text-xs text-zinc-400">
                Auto-detects 32-char v3 API keys and v4 JWT Read Access Tokens. Stored strictly in your browser’s localStorage.
              </p>
            </div>
          </div>

          <a
            href="https://www.themoviedb.org/settings/api"
            target="_blank"
            rel="noopener noreferrer"
            className="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-bold text-[#F5C518] flex items-center gap-1 shrink-0"
          >
            <span>Get TMDB Key</span>
            <ExternalLink className="w-3.5 h-3.5" />
          </a>
        </div>

        <div className="flex flex-col sm:flex-row gap-2.5">
          <input
            type="password"
            value={apiKeyInput}

          />

            {testingKey ? <RefreshCw className="w-4 h-4 animate-spin" /> : <CheckCircle2 className="w-4 h-4" />}

          <button

            Clear Key
          </button>
        </div>

        <div
          className={`p-3 rounded-xl border text-xs font-bold flex items-center gap-2 ${
            settings.tmdbKeyStatus === 'valid'
              ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300'
              : settings.tmdbKeyStatus === 'invalid'
              ? 'bg-red-500/15 border-red-500/40 text-red-300'
              : 'bg-white/5 border-white/10 text-zinc-300'

        >
          <span>{validationMsg}</span>
        </div>
      </section>

      {/* SECTION 1: Account & Active Profile */}
      <section className="p-5 sm:p-6 rounded-2xl bg-[#141416] border border-white/10 space-y-4">

            <label className="block text-xs font-bold text-zinc-400 mb-1">Active Profile Name</label>
            <input

              onChange={(e) => setProfName(e.target.value)}

          </div>
          <div>
            <label className="block text-xs font-bold text-zinc-400 mb-1">Profile Avatar</label>
            <div className="flex gap-2">
              {AVATAR_OPTIONS.map((av) => (

        <div className="flex items-center justify-between pt-2">
          <label className="flex items-center gap-2 text-xs font-bold text-zinc-300 cursor-pointer">
            <input

            <span>Kids Mode Profile (Filters out 18+ titles)</span>

          <button

              onUpdateProfile(profName, profAvatar, profKids);
              onNotify('Account & Profile changes saved!');
            }}
            className="px-4 py-2 rounded-xl bg-[#F5C518] text-black text-xs font-black"
          >

        </div>
      </section>

      {/* SECTION 3: Preferences (Region, Language, Streaming Services) */}

              return (
                <button
                  key={p.provider_id}
                  type="button"
                  onClick={() => onTogglePreferredProvider(p.provider_id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold border flex items-center gap-1.5 ${
                    active
                      ? 'bg-[#F5C518]/20 text-[#F5C518] border-[#F5C518]'
                      : 'bg-black/50 text-zinc-400 border-white/10'
                  }`}
                >
                  <span>{p.provider_name}</span>
                  {active && <span>✓</span>}
                </button>
              );
            })}
          </div>
        </div>
      </section>

      {/* SECTION 4: Playback, Display & Mobile UI Frame Preview */}
      <section className="p-5 sm:p-6 rounded-2xl bg-[#141416] border border-white/10 space-y-4">
        <h2 className="text-base font-black text-white flex items-center gap-2">
          <Monitor className="w-4 h-4 text-[#F5C518]" />
          <span>4. Playback, Display & Theme</span>
        </h2>

        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label className="block text-xs font-bold text-zinc-400 mb-1">TMDB Image Quality</label>
            <select
              value={settings.imageQuality}
              onChange={(e) => onUpdateSettings({ imageQuality: e.target.value as any })}
              aria-label="Image Quality"
              className="w-full px-3 py-2 rounded-xl bg-black border border-white/15 text-xs font-bold text-white"
            >
              <option value="w500">Data Saver (w500)</option>
              <option value="w780">HD Balanced (w780)</option>
              <option value="original">4K Ultra HD (original)</option>
            </select>
          </div>

          <div>
            <label className="block text-xs font-bold text-zinc-400 mb-1">Cinema Theme</label>
            <select
              value={settings.theme}
              onChange={(e) => onUpdateSettings({ theme: e.target.value as any })}
              aria-label="Theme Mode"
              className="w-full px-3 py-2 rounded-xl bg-black border border-white/15 text-xs font-bold text-white"
            >
              <option value="dark">Cinematic Dark (#0A0A0B)</option>
              <option value="amoled">AMOLED Pitch Black (#000000)</option>
              <option value="system">System Default</option>
            </select>
          </div>

          <div>
            <label className="block text-xs font-bold text-zinc-400 mb-1">Viewport Layout Mode</label>
            <select
              value={settings.layoutPreview}
              onChange={(e) => onUpdateSettings({ layoutPreview: e.target.value as any })}
              aria-label="Viewport Layout Mode"
              className="w-full px-3 py-2 rounded-xl bg-black border border-white/15 text-xs font-bold text-white"
            >
              <option value="auto">Auto Responsive</option>
              <option value="mobile">Netflix Mobile App Frame</option>
              <option value="desktop">Desktop Widescreen</option>
            </select>
          </div>
        </div>

        <div className="flex flex-wrap gap-6 pt-1">
          <label className="flex items-center gap-2 text-xs font-bold text-zinc-300 cursor-pointer">
            <input
              type="checkbox"
              checked={settings.autoplayTrailers}
              onChange={(e) => onUpdateSettings({ autoplayTrailers: e.target.checked })}
              className="rounded border-white/20 bg-black text-[#F5C518]"
            />
            <span>Autoplay Hero Previews</span>
          </label>
          <label className="flex items-center gap-2 text-xs font-bold text-zinc-300 cursor-pointer">
            <input
              type="checkbox"
              checked={settings.reduceMotion}
              onChange={(e) => onUpdateSettings({ reduceMotion: e.target.checked })}
              className="rounded border-white/20 bg-black text-[#F5C518]"
            />
            <span>Reduce Motion (Disable auto-carousel rotation)</span>
          </label>
        </div>
      </section>

      {/* SECTION 5: AI Recommendations & Optional LLM Key */}
      <section className="p-5 sm:p-6 rounded-2xl bg-[#141416] border border-white/10 space-y-4">
        <h2 className="text-base font-black text-white flex items-center gap-2">
          <Sparkles className="w-4 h-4 text-[#F5C518]" />
          <span>5. AI Taste Engine & Natural-Language Concierge</span>
        </h2>

        <label className="flex items-center gap-2 text-xs font-bold text-zinc-300 cursor-pointer">
          <input
            type="checkbox"
            checked={settings.enableAiRecommendations}
            onChange={(e) =>
              onUpdateSettings({ enableAiRecommendations: e.target.checked })
            }
            className="rounded border-white/20 bg-black text-[#F5C518]"
          />
          <span>Enable Personalized AI Match % & “Picked for You” Row</span>
        </label>

        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label className="block text-xs font-bold text-zinc-400 mb-1">Optional LLM Provider</label>
            <select
              value={settings.llmProvider}
              onChange={(e) => onUpdateSettings({ llmProvider: e.target.value as any })}
              aria-label="LLM Provider"
              className="w-full px-3 py-2 rounded-xl bg-black border border-white/15 text-xs font-bold text-white"
            >
              <option value="gemini">Google Gemini API</option>
              <option value="openai">OpenAI API</option>
            </select>
          </div>
          <div className="sm:col-span-2">
            <label className="block text-xs font-bold text-zinc-400 mb-1">
              Optional LLM API Key (For “What Should I Watch?” Concierge)
            </label>
            <input
              type="password"
              value={settings.llmApiKey}
              onChange={(e) => onUpdateSettings({ llmApiKey: e.target.value })}
              placeholder="Optional: Paste Gemini or OpenAI key (local fallback works without key)"
              className="w-full px-3.5 py-2 rounded-xl bg-black border border-white/15 text-xs text-white"
            />
          </div>
        </div>
      </section>

      {/* SECTION 6: Data & Privacy */}
      <section className="p-5 sm:p-6 rounded-2xl bg-[#141416] border border-white/10 space-y-4">
        <h2 className="text-base font-black text-white flex items-center gap-2">
          <Database className="w-4 h-4 text-[#F5C518]" />
          <span>6. Data, Cache & Privacy</span>
        </h2>

        <div className="flex flex-wrap gap-2.5">
          <button
            type="button"
            onClick={onExportAllJson}
            className="px-4 py-2 rounded-xl bg-[#F5C518] text-black text-xs font-black flex items-center gap-1.5"
          >
            <Download className="w-3.5 h-3.5" />
            <span>Export All Data (JSON)</span>
          </button>

          <button
            type="button"
            onClick={() => {
              clearTmdbCache();
              onNotify('Cleared TMDB response cache.');
            }}
            className="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-bold text-white"
          >
            Clear TMDB Cache ({cacheStats.count} entries • {cacheStats.approxKb} KB)
          </button>

          <button
            type="button"
            onClick={() => {
              onClearWatchHistory();
              onNotify('Watch history cleared.');
            }}
            className="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-bold text-white"
          >
            Clear Watch History
          </button>

          <button
            type="button"
            onClick={() => {
              onClearRatings();
              onNotify('All ratings and reviews cleared.');
            }}
            className="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-bold text-white"
          >
            Clear Ratings & Reviews
          </button>

          <button
            type="button"
            onClick={() => setConfirmResetModal(true)}
            className="px-4 py-2 rounded-xl bg-red-500/20 hover:bg-red-500/30 border border-red-500/40 text-xs font-bold text-red-300 flex items-center gap-1.5"
          >
            <Trash2 className="w-3.5 h-3.5" />
            <span>Delete All Local Data</span>
          </button>
        </div>

        {confirmResetModal && (
          <div className="p-4 rounded-xl bg-red-950/50 border border-red-500/40 flex items-center justify-between gap-4">
            <span className="text-xs font-bold text-red-200">
              Are you sure? This resets all profiles, lists, ratings, and keys back to factory defaults.
            </span>
            <div className="flex gap-2 shrink-0">
              <button
                type="button"
                onClick={() => setConfirmResetModal(false)}
                className="px-3 py-1.5 rounded-lg bg-white/10 text-xs font-bold text-white"
              >
                Cancel
              </button>
              <button
                type="button"
                onClick={() => {
                  setConfirmResetModal(false);
                  onResetAllData();
                }}
                className="px-3 py-1.5 rounded-lg bg-[#E50914] text-xs font-black text-white"
              >
                Confirm Reset
              </button>
            </div>
          </div>
        )}
      </section>

      {/* SECTION 7: About & Official TMDB Attribution */}
      <section className="p-5 sm:p-6 rounded-2xl bg-[#141416] border border-white/10 space-y-3">
        <h2 className="text-base font-black text-white flex items-center gap-2">
          <Info className="w-4 h-4 text-[#F5C518]" />
          <span>7. About Anora v2.5.0 & Attribution</span>
        </h2>
        <p className="text-xs text-zinc-300 leading-relaxed">
          Anora unifies the mobile-first discovery UI of Netflix, the regional streaming availability guide of JustWatch, and the deep cast, crew, and rating encyclopedia of IMDb in a zero-backend local web application.
        </p>
        <div className="p-3.5 rounded-xl bg-black/60 border border-cyan-500/30 flex items-center gap-3">
          <span className="px-2.5 py-1 rounded bg-cyan-500 text-black font-black text-xs shrink-0">
            TMDB
          </span>
          <p className="text-xs text-zinc-300 font-semibold">
            This product uses the TMDB API but is not endorsed or certified by TMDB. Streaming availability data powered by JustWatch via TMDB.
          </p>
        </div>
        <div className="text-[11px] text-zinc-400">
          Keyboard Shortcuts: Press <kbd className="px-1.5 py-0.5 rounded bg-white/10 text-white">/</kbd> to focus Search, <kbd className="px-1.5 py-0.5 rounded bg-white/10 text-white">Esc</kbd> to close modals.
        </div>
      </section>
    </div>
  );
};

// --- MODULE: App.tsx ---

export default function App() {
  const initial = loadPersistedState();
  const [account, setAccount] = useState<AccountUser | null>(initial.account);
  const [profiles, setProfiles] = useState<ProfileData[]>(initial.profiles);
  const [activeProfileId, setActiveProfileId] = useState<string | null>(
    initial.activeProfileId
  );
  const [settings, setSettings] = useState<AppSettings>(initial.settings);

  const [route, setRoute] = useState<NavRoute>('home');
  const [catalog, setCatalog] = useState<MediaItem[]>(SEED_MEDIA);
  const [selectedMedia, setSelectedMedia] = useState<MediaItem>(SEED_MEDIA[0]);
  const [selectedPerson, setSelectedPerson] = useState<PersonDetail>(SEED_PEOPLE[0]);
  const [myAnoraSection, setMyAnoraSection] = useState<
    'hub' | 'watchlist' | 'ratings' | 'lists' | 'history'
  >('hub');

  // Home category filters
  const [categoryTab, setCategoryTab] = useState<'all' | 'tv' | 'movie' | 'new'>('all');
  const [selectedGenreId, setSelectedGenreId] = useState<number | null>(null);
  const [selectedProviderId, setSelectedProviderId] = useState<number | null>(null);

  // Modals
  const [trailerMedia, setTrailerMedia] = useState<MediaItem | null>(null);
  const [ratingModalMedia, setRatingModalMedia] = useState<MediaItem | null>(null);
  const [listModalMedia, setListModalMedia] = useState<MediaItem | null>(null);
  const [categoriesOpen, setCategoriesOpen] = useState(false);
  const [aiConciergeOpen, setAiConciergeOpen] = useState(false);
  const [toastMessage, setToastMessage] = useState<string | null>(null);

  const activeProfile =
    profiles.find((p) => p.id === activeProfileId) || profiles[0];

  const notify = useCallback((msg: string) => {
    setToastMessage(msg);
  }, []);

  useEffect(() => {
    if (!toastMessage) return;
    const t = setTimeout(() => setToastMessage(null), 3200);
    return () => clearTimeout(t);
  }, [toastMessage]);

  // Persist state on change
  useEffect(() => {
    savePersistedState({
      account,
      activeProfileId,
      profiles,
      settings,
    });
  }, [account, activeProfileId, profiles, settings]);

  // Fetch live TMDB catalog when API key changes
  useEffect(() => {
    let cancelled = false;
    fetchCatalogMedia(settings.tmdbApiKey).then((items) => {
      if (!cancelled && items.length > 0) {
        setCatalog(items);
      }
    });
    return () => {
      cancelled = true;
    };
  }, [settings.tmdbApiKey]);

  // Global Keyboard Shortcuts: '/' to focus search, 'Escape' to close modals
  useEffect(() => {
    const onKeyDown = (e: KeyboardEvent) => {
      const tag = (e.target as HTMLElement)?.tagName;
      const isInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if (e.key === '/' && !isInput) {
        e.preventDefault();
        setRoute('search');
        setTimeout(() => {
          const el = document.getElementById('anora-search-input');
          if (el) el.focus();
        }, 60);
      } else if (e.key === 'Escape') {
        setTrailerMedia(null);
        setRatingModalMedia(null);
        setListModalMedia(null);
        setCategoriesOpen(false);
        setAiConciergeOpen(false);
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, []);

  const mutateActiveProfile = (updater: (prof: ProfileData) => ProfileData) => {
    setProfiles((prev) =>
      prev.map((p) => (p.id === activeProfile.id ? updater(p) : p))
    );
  };

  // Select a movie or TV series → auto-log to Watch History & fetch full details
  const handleSelectMedia = async (item: MediaItem) => {
    setSelectedMedia(item);
    setRoute('detail');
    window.scrollTo({ top: 0, behavior: 'smooth' });

    mutateActiveProfile((prof) => {
      const filtered = prof.watchHistory.filter(
        (h) => !(h.mediaId === item.id && h.mediaType === item.media_type)
      );
      return {
        ...prof,
        watchHistory: [
          {
            mediaId: item.id,
            mediaType: item.media_type,
            title: item.title,
            poster_path: item.poster_path,
            backdrop_path: item.backdrop_path,
            year: item.year,
            progressPercent: 35,
            lastEpisode: item.media_type === 'tv' ? 'S1:E1' : 'Feature Film',
            timestampLabel: item.media_type === 'tv' ? '34m left' : '1h 18m left',
            viewedAt: new Date().toISOString(),
            genre_ids: item.genre_ids,
          },
          ...filtered,
        ].slice(0, 20),
      };
    });

    if (settings.tmdbApiKey.trim()) {
      const full = await fetchMediaDetail(
        item.id,
        item.media_type,
        settings.tmdbApiKey,
        settings.region
      );
      setSelectedMedia(full);
    }
  };

  const handleSelectPerson = async (personId: number) => {
    const p = await fetchPersonDetail(personId, settings.tmdbApiKey);
    setSelectedPerson(p);
    setRoute('person');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const handleToggleWatchlist = (item: MediaItem, e?: React.MouseEvent) => {
    if (e) e.stopPropagation();
    const exists = activeProfile.watchlist.some(
      (w) => w.mediaId === item.id && w.mediaType === item.media_type
    );
    mutateActiveProfile((prof) => ({
      ...prof,
      watchlist: exists
        ? prof.watchlist.filter(
            (w) => !(w.mediaId === item.id && w.mediaType === item.media_type)
          )
        : [
            {
              mediaId: item.id,
              mediaType: item.media_type,
              title: item.title,
              poster_path: item.poster_path,
              backdrop_path: item.backdrop_path,
              year: item.year,
              vote_average: item.vote_average,
              runtime: item.runtime,
              genre_ids: item.genre_ids,
              addedAt: new Date().toISOString(),
              watched: false,
            },
            ...prof.watchlist,
          ],
    }));
    notify(
      exists
        ? `Removed "${item.title}" from My List`
        : `Added "${item.title}" to My List`
    );
  };

  const handleToggleWatched = (mediaId: number, mediaType: 'movie' | 'tv') => {
    mutateActiveProfile((prof) => {
      const inList = prof.watchlist.some(
        (w) => w.mediaId === mediaId && w.mediaType === mediaType
      );
      if (inList) {
        return {
          ...prof,
          watchlist: prof.watchlist.map((w) =>
            w.mediaId === mediaId && w.mediaType === mediaType
              ? { ...w, watched: !w.watched }
              : w
          ),
        };
      }
      const item =
        catalog.find((m) => m.id === mediaId && m.media_type === mediaType) ||
        selectedMedia;
      return {
        ...prof,
        watchlist: [
          {
            mediaId: item.id,
            mediaType: item.media_type,
            title: item.title,
            poster_path: item.poster_path,
            backdrop_path: item.backdrop_path,
            year: item.year,
            vote_average: item.vote_average,
            genre_ids: item.genre_ids,
            addedAt: new Date().toISOString(),
            watched: true,
          },
          ...prof.watchlist,
        ],
      };
    });
    notify('Updated watched status!');
  };

  const handleSaveRating = (
    item: MediaItem,
    rating: number,
    thumb: ThumbReaction
  ) => {
    const key = `${item.media_type}-${item.id}`;
    mutateActiveProfile((prof) => ({
      ...prof,
      ratings: {
        ...prof.ratings,
        [key]: {
          mediaId: item.id,
          mediaType: item.media_type,
          title: item.title,
          poster_path: item.poster_path,
          year: item.year,
          genre_ids: item.genre_ids,
          rating,
          thumb,
          ratedAt: new Date().toISOString(),
        },
      },
    }));
    notify(`Rated "${item.title}" ★ ${rating}/10`);
  };

  const handleSaveReview = (
    item: MediaItem,
    rating: number,
    thumb: ThumbReaction,
    headline: string,
    content: string,
    containsSpoilers: boolean,
    episodeTag?: string
  ) => {
    handleSaveRating(item, rating, thumb);
    mutateActiveProfile((prof) => ({
      ...prof,
      reviews: [
        {
          id: `rev_${Date.now()}`,
          mediaId: item.id,
          mediaType: item.media_type,
          mediaTitle: item.title,
          mediaPoster: item.poster_path,
          mediaYear: item.year,
          rating,
          thumb,
          headline,
          content,
          containsSpoilers,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          episodeTag,
        },
        ...prof.reviews,
      ],
    }));
    notify(`Saved review for "${item.title}" to My Anora!`);
  };

  const handleShare = async (item: MediaItem) => {
    const shareText = `Watch "${item.title}" (${item.year}) on Anora — IMDb ★ ${item.vote_average.toFixed(1)}`;
    const shareUrl = `https://www.themoviedb.org/${item.media_type}/${item.id}`;
    try {
      if (navigator.share) {
        await navigator.share({ title: item.title, text: shareText, url: shareUrl });
        notify(`Shared "${item.title}"!`);
        return;
      }
    } catch {
      // Fallback
    }
    try {
      const temp = document.createElement('textarea');
      temp.value = `${shareText} ${shareUrl}`;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
    } catch {
      // Ignore
    }
    notify(`Copied share link for "${item.title}" to clipboard!`);
  };

  const handleExportAllJson = () => {
    const payload = JSON.stringify(
      { account, profiles, settings, exportedAt: new Date().toISOString() },
      null,
      2
    );
    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `anora-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    notify('Exported full Anora JSON backup!');
  };

  // Fullscreen Auth / Profile / Onboarding routes
  if (route === 'auth') {
    return (
      <AuthScreen
        onSuccess={(user, isNew, avatarId) => {
          setAccount(user);
          if (isNew) {
            const av =
              AVATAR_OPTIONS.find((a) => a.id === avatarId) || AVATAR_OPTIONS[0];
            const newProf: ProfileData = {
              ...INITIAL_PROFILES[0],
              id: `prof_${Date.now()}`,
              name: user.name.split(' ')[0] || 'User',
              avatarId: av.id,
              avatarColor: av.color,
              avatarEmoji: av.emoji,
              onboardingCompleted: false,
            };
            setProfiles((prev) => [newProf, ...prev]);
            setActiveProfileId(newProf.id);
            setRoute('onboarding');
          } else {
            setRoute('profiles');
          }
          notify(`Welcome to Anora, ${user.name}!`);
        }}
        onGuestMode={() => {
          setAccount({
            id: 'usr_guest',
            name: 'Guest Viewer',
            email: 'guest@anora.cinema',
            passwordHash: '',
            createdAt: new Date().toISOString(),
            isGuest: true,
          });
          setRoute('home');
          notify('Browsing in Guest Mode');
        }}
      />
    );
  }

  if (route === 'profiles') {
    return (
      <ProfileGate
        profiles={profiles}
        onSelectProfile={(id) => {
          setActiveProfileId(id);
          const chosen = profiles.find((p) => p.id === id);
          if (chosen && !chosen.onboardingCompleted) {
            setRoute('onboarding');
          } else {
            setRoute('home');
          }
          notify(`Switched profile to ${chosen?.name || 'User'}`);
        }}
        onAddProfile={(name, avatarId, isKids) => {
          const av =
            AVATAR_OPTIONS.find((a) => a.id === avatarId) || AVATAR_OPTIONS[0];
          const created: ProfileData = {
            id: `prof_${Date.now()}`,
            name,
            avatarId: av.id,
            avatarColor: av.color,
            avatarEmoji: av.emoji,
            isKids,
            onboardingCompleted: false,
            favoriteTitleIds: [1001, 1002],
            preferredProviders: [8, 119],
            watchlist: [],
            ratings: {},
            reviews: [],
            customLists: [],
            watchHistory: [],
            recentSearches: [],
            savedFilterPresets: [],
          };
          setProfiles((prev) => [...prev, created]);
          setActiveProfileId(created.id);
          setRoute('onboarding');
        }}
        onGuestMode={() => {
          setRoute('home');
          notify('Continuing as Guest Viewer');
        }}
      />
    );
  }

  if (route === 'onboarding') {
    return (
      <OnboardingWizard
        catalog={catalog}
        initialFavorites={activeProfile.favoriteTitleIds}
        initialProviders={activeProfile.preferredProviders}
        initialRegion={settings.region}
        onComplete={(favs, provs, reg) => {
          mutateActiveProfile((p) => ({
            ...p,
            onboardingCompleted: true,
            favoriteTitleIds: favs,
            preferredProviders: provs,
          }));
          setSettings((s) => ({ ...s, region: reg }));
          setRoute('home');
          notify('Taste Graph calibrated! Welcome to Anora.');
        }}
      />
    );
  }

  const isMobileFrame = settings.layoutPreview === 'mobile';
  const bgClass = settings.theme === 'amoled' ? 'bg-black' : 'bg-[#0A0A0B]';

  return (
    <div
      className={`min-h-screen ${bgClass} text-white font-sans selection:bg-[#F5C518] selection:text-black`}
    >
      {/* Optional Phone Frame Wrapper when user toggles Mobile App Frame Preview */}
      <div
        className={
          isMobileFrame
            ? 'max-w-[430px] mx-auto min-h-screen border-x border-white/15 shadow-[0_0_90px_rgba(245,197,24,0.12)] relative bg-[#0A0A0B]'
            : 'w-full min-h-screen relative'
        }
      >
        {/* Top Cinematic Header Bar (Matches Netflix Mobile Header + Desktop Top Nav) */}
        <header className="sticky top-0 z-40 bg-[#0A0A0B]/90 backdrop-blur-xl border-b border-white/10 px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
          {/* Left: Brand Emblem */}
          <div className="flex items-center gap-5">
            <button
              type="button"
              onClick={() => {
                setCategoryTab('all');
                setSelectedGenreId(null);
                setSelectedProviderId(null);
                setRoute('home');
              }}
              className="flex items-center gap-2.5 group focus:outline-none"
            >
              <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-[#E50914] via-[#E50914] to-[#F5C518] flex items-center justify-center text-white font-black text-lg shadow-md group-hover:scale-105 transition-transform">
                A
              </div>
              <div className="text-left">
                <span className="text-lg font-black tracking-tight text-white block leading-none">
                  ANORA
                </span>
                <span className="text-[9px] font-extrabold uppercase tracking-widest text-[#F5C518] block">
                  {settings.region} • {settings.tmdbKeyStatus === 'valid' ? 'TMDB LIVE' : 'DEMO 4K'}
                </span>
              </div>
            </button>

            {/* Desktop Top Navigation Links */}
            {!isMobileFrame && (
              <nav className="hidden md:flex items-center gap-1">
                {(
                  [
                    { id: 'home', label: 'Home' },
                    { id: 'discover', label: 'Discover' },
                    { id: 'search', label: 'Search' },
                    { id: 'watchlist', label: 'Watchlist' },
                    { id: 'my-anora', label: 'My Anora' },
                    { id: 'settings', label: 'Settings & API' },
                  ] as const
                ).map((item) => {
                  const active =
                    route === item.id ||
                    (item.id === 'watchlist' &&
                      route === 'my-anora' &&
                      myAnoraSection === 'watchlist');
                  return (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => {
                        if (item.id === 'watchlist') {
                          setMyAnoraSection('watchlist');
                          setRoute('my-anora');
                        } else if (item.id === 'my-anora') {
                          setMyAnoraSection('hub');
                          setRoute('my-anora');
                        } else {
                          setRoute(item.id);
                        }
                      }}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${
                        active
                          ? 'bg-white/10 text-[#F5C518]'
                          : 'text-zinc-300 hover:text-white hover:bg-white/5'
                      }`}
                    >
                      {item.label}
                    </button>
                  );
                })}
              </nav>
            )}
          </div>

          {/* Right Header Controls: Mobile/Desktop Frame Toggle, Search, API Key, Profile */}
          <div className="flex items-center gap-2">
            <button
              type="button"
              onClick={() =>
                setSettings((s) => ({
                  ...s,
                  layoutPreview: s.layoutPreview === 'mobile' ? 'auto' : 'mobile',
                }))
              }
              title="Toggle Mobile App Frame vs Full Widescreen"
              className={`px-2.5 py-1.5 rounded-xl border text-xs font-bold flex items-center gap-1.5 transition-colors ${
                isMobileFrame
                  ? 'bg-[#F5C518] text-black border-[#F5C518]'
                  : 'bg-[#141416] text-zinc-300 border-white/15 hover:text-white'
              }`}
            >
              {isMobileFrame ? (
                <>
                  <Monitor className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Widescreen</span>
                </>
              ) : (
                <>
                  <Smartphone className="w-3.5 h-3.5 text-[#F5C518]" />
                  <span className="hidden sm:inline">Mobile UI</span>
                </>
              )}
            </button>

            <button
              type="button"
              onClick={() => setRoute('search')}
              aria-label="Open Search"
              className="w-9 h-9 rounded-xl bg-[#141416] hover:bg-white/10 border border-white/15 flex items-center justify-center text-white"
            >
              <Search className="w-4 h-4" />
            </button>

            <button
              type="button"
              onClick={() => setRoute('settings')}
              aria-label="Open Settings & TMDB API Key"
              className="w-9 h-9 rounded-xl bg-[#141416] hover:bg-white/10 border border-white/15 flex items-center justify-center text-[#F5C518]"
            >
              <SettingsIcon className="w-4 h-4" />
            </button>

            {/* Netflix Square Smiley Avatar Profile Switcher Button (Matches Screenshot 1) */}
            <button
              type="button"
              onClick={() => setRoute('profiles')}
              title={`Active Profile: ${activeProfile.name} (Click to switch)`}
              className={`h-9 px-2.5 rounded-xl bg-gradient-to-br ${activeProfile.avatarColor} flex items-center gap-1.5 text-xs font-black text-white shadow border border-white/25`}
            >
              <span>{activeProfile.avatarEmoji}</span>
              <span className="hidden sm:inline">{activeProfile.name}</span>
            </button>
          </div>
        </header>

        {/* Main Screen Router */}
        <main>
          {route === 'home' && (
            <HomePage
              catalog={catalog}
              profile={activeProfile}
              region={settings.region}
              imageQuality={settings.imageQuality}
              reduceMotion={settings.reduceMotion}
              isMobileLayout={isMobileFrame}
              hasApiKey={Boolean(settings.tmdbApiKey.trim())}
              enableAi={settings.enableAiRecommendations}
              categoryTab={categoryTab}
              selectedGenreId={selectedGenreId}
              selectedProviderId={selectedProviderId}
              onChangeCategoryTab={setCategoryTab}
              onOpenCategoriesDrawer={() => setCategoriesOpen(true)}
              onOpenAiConcierge={() => setAiConciergeOpen(true)}
              onSelectMedia={handleSelectMedia}
              onPlayTrailer={(item) => setTrailerMedia(item)}
              onToggleWatchlist={handleToggleWatchlist}
              onQuickRate={(item, e) => {
                e.stopPropagation();
                setRatingModalMedia(item);
              }}
              onRemoveHistory={(mediaId, mediaType) => {
                mutateActiveProfile((p) => ({
                  ...p,
                  watchHistory: p.watchHistory.filter(
                    (h) => !(h.mediaId === mediaId && h.mediaType === mediaType)
                  ),
                }));
                notify('Removed from Continue Watching');
              }}
              onNavigateSettingsApi={() => setRoute('settings')}
              onNavigateWatchlist={() => {
                setMyAnoraSection('watchlist');
                setRoute('my-anora');
              }}
            />
          )}

          {route === 'search' && (
            <SearchPage
              catalog={catalog}
              apiKey={settings.tmdbApiKey}
              imageQuality={settings.imageQuality}
              recentSearches={activeProfile.recentSearches}
              watchlist={activeProfile.watchlist}
              ratings={activeProfile.ratings}
              onAddRecentSearch={(q) => {
                mutateActiveProfile((p) => ({
                  ...p,
                  recentSearches: [
                    q,
                    ...p.recentSearches.filter((x) => x.toLowerCase() !== q.toLowerCase()),
                  ].slice(0, 8),
                }));
              }}
              onClearRecentSearches={() =>
                mutateActiveProfile((p) => ({ ...p, recentSearches: [] }))
              }
              onSelectMedia={handleSelectMedia}
              onSelectPerson={handleSelectPerson}
              onToggleWatchlist={handleToggleWatchlist}
              onQuickRate={(item, e) => {
                e.stopPropagation();
                setRatingModalMedia(item);
              }}
            />
          )}

          {route === 'discover' && (
            <DiscoverPage
              catalog={catalog}
              region={settings.region}
              imageQuality={settings.imageQuality}
              watchlist={activeProfile.watchlist}
              ratings={activeProfile.ratings}
              savedPresets={activeProfile.savedFilterPresets}
              onSavePreset={(preset) => {
                mutateActiveProfile((p) => ({
                  ...p,
                  savedFilterPresets: [
                    { ...preset, id: `preset_${Date.now()}` },
                    ...p.savedFilterPresets,
                  ],
                }));
                notify(`Saved filter preset "${preset.name}"!`);
              }}
              onDeletePreset={(id) => {
                mutateActiveProfile((p) => ({
                  ...p,
                  savedFilterPresets: p.savedFilterPresets.filter((x) => x.id !== id),
                }));
              }}
              onSelectMedia={handleSelectMedia}
              onToggleWatchlist={handleToggleWatchlist}
              onQuickRate={(item, e) => {
                e.stopPropagation();
                setRatingModalMedia(item);
              }}
            />
          )}

          {route === 'detail' && (
            <TitleDetail
              item={selectedMedia}
              catalog={catalog}
              region={settings.region}
              preferredProviders={activeProfile.preferredProviders}
              imageQuality={settings.imageQuality}
              inWatchlist={activeProfile.watchlist.some(
                (w) =>
                  w.mediaId === selectedMedia.id &&
                  w.mediaType === selectedMedia.media_type
              )}
              isWatched={activeProfile.watchlist.some(
                (w) =>
                  w.mediaId === selectedMedia.id &&
                  w.mediaType === selectedMedia.media_type &&
                  w.watched
              )}
              userRating={
                activeProfile.ratings[
                  `${selectedMedia.media_type}-${selectedMedia.id}`
                ]
              }
              reviews={activeProfile.reviews}
              onBack={() => setRoute('home')}
              onChangeRegion={(reg) => setSettings((s) => ({ ...s, region: reg }))}
              onPlayTrailer={(item) => setTrailerMedia(item)}
              onToggleWatchlist={handleToggleWatchlist}
              onToggleWatched={(item) => handleToggleWatched(item.id, item.media_type)}
              onOpenRatingModal={(item) => setRatingModalMedia(item)}
              onDirectRate={(item, rating, thumb) =>
                handleSaveRating(item, rating, thumb)
              }
              onOpenListModal={(item) => setListModalMedia(item)}
              onSelectPerson={handleSelectPerson}
              onSelectMedia={handleSelectMedia}
              onShare={handleShare}
            />
          )}

          {route === 'person' && (
            <PersonDetailPage
              person={selectedPerson}
              catalog={catalog}
              imageQuality={settings.imageQuality}
              onBack={() => setRoute('detail')}
              onSelectMedia={handleSelectMedia}
            />
          )}

          {(route === 'my-anora' || route === 'watchlist') && (
            <MyAnoraPage
              profile={activeProfile}
              allProfiles={profiles}
              catalog={catalog}
              imageQuality={settings.imageQuality}
              initialSection={route === 'watchlist' ? 'watchlist' : myAnoraSection}
              onSwitchProfile={(id) => {
                setActiveProfileId(id);
                notify('Switched active profile');
              }}
              onSelectMedia={handleSelectMedia}
              onToggleWatched={handleToggleWatched}
              onRemoveWatchlist={(mediaId, mediaType) => {
                mutateActiveProfile((p) => ({
                  ...p,
                  watchlist: p.watchlist.filter(
                    (w) => !(w.mediaId === mediaId && w.mediaType === mediaType)
                  ),
                }));
                notify('Removed from Watchlist');
              }}
              onDeleteReview={(revId) => {
                mutateActiveProfile((p) => ({
                  ...p,
                  reviews: p.reviews.filter((r) => r.id !== revId),
                }));
                notify('Deleted review');
              }}
              onCreateList={(name, description) => {
                mutateActiveProfile((p) => ({
                  ...p,
                  customLists: [
                    {
                      id: `list_${Date.now()}`,
                      name,
                      description,
                      isPublic: true,
                      createdAt: new Date().toISOString(),
                      items: [],
                    },
                    ...p.customLists,
                  ],
                }));
                notify(`Created custom list "${name}"`);
              }}
              onDeleteList={(listId) => {
                mutateActiveProfile((p) => ({
                  ...p,
                  customLists: p.customLists.filter((l) => l.id !== listId),
                }));
                notify('Deleted custom list');
              }}
              onClearHistory={() => {
                mutateActiveProfile((p) => ({ ...p, watchHistory: [] }));
                notify('Cleared watch history');
              }}
              onShare={handleShare}
            />
          )}

          {route === 'settings' && (
            <SettingsPage
              account={account}
              profile={activeProfile}
              settings={settings}
              onUpdateSettings={(partial) =>
                setSettings((prev) => ({ ...prev, ...partial }))
              }
              onUpdateAccount={(name, email) =>
                setAccount((prev) =>
                  prev ? { ...prev, name, email } : null
                )
              }
              onUpdateProfile={(name, avatarId, isKids) => {
                const av =
                  AVATAR_OPTIONS.find((a) => a.id === avatarId) || AVATAR_OPTIONS[0];
                mutateActiveProfile((p) => ({
                  ...p,
                  name,
                  avatarId: av.id,
                  avatarColor: av.color,
                  avatarEmoji: av.emoji,
                  isKids,
                }));
              }}
              onTogglePreferredProvider={(provId) => {
                mutateActiveProfile((p) => ({
                  ...p,
                  preferredProviders: p.preferredProviders.includes(provId)
                    ? p.preferredProviders.filter((x) => x !== provId)
                    : [...p.preferredProviders, provId],
                }));
              }}
              onExportAllJson={handleExportAllJson}
              onClearWatchHistory={() =>
                mutateActiveProfile((p) => ({ ...p, watchHistory: [] }))
              }
              onClearRatings={() =>
                mutateActiveProfile((p) => ({ ...p, ratings: {}, reviews: [] }))
              }
              onResetAllData={() => {
                try {
                  localStorage.clear();
                } catch {
                  // Ignore
                }
                setProfiles(INITIAL_PROFILES);
                setActiveProfileId(INITIAL_PROFILES[0].id);
                setSettings(DEFAULT_SETTINGS);
                notify('All local data reset to factory defaults.');
              }}
              onSignOut={() => {
                setRoute('auth');
                notify('Signed out of session.');
              }}
              onRerunOnboarding={() => setRoute('onboarding')}
              onNotify={notify}
            />
          )}
        </main>

        {/* Netflix Mobile Bottom Navigation Bar with Center Ribbon Emblem (Matches Screenshots 1, 2, 3, 4) */}
        <nav
          aria-label="Mobile Bottom Navigation"
          className="fixed bottom-3 inset-x-0 z-40 px-4 flex justify-center pointer-events-none"
        >
          <div className="pointer-events-auto w-full max-w-md rounded-2xl bg-[#121216]/95 backdrop-blur-2xl border border-white/15 px-3 py-2 shadow-[0_12px_40px_rgba(0,0,0,0.9)] flex items-center justify-around">
            <button
              type="button"
              onClick={() => {
                setCategoryTab('all');
                setRoute('home');
              }}
              className={`flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-[10px] font-bold transition-colors ${
                route === 'home' && categoryTab === 'all'
                  ? 'text-white'
                  : 'text-zinc-400 hover:text-white'
              }`}
            >
              <Home className="w-4 h-4" />
              <span>Home</span>
            </button>

            <button
              type="button"
              onClick={() => setRoute('discover')}
              className={`flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-[10px] font-bold transition-colors ${
                route === 'discover' ? 'text-[#F5C518]' : 'text-zinc-400 hover:text-white'
              }`}
            >
              <Compass className="w-4 h-4" />
              <span>Discover</span>
            </button>

            {/* Center Netflix-style Ribbon Emblem (Triggers AI Concierge or Home Top 10) */}
            <button
              type="button"
              onClick={() => setAiConciergeOpen(true)}
              aria-label="Open Anora AI Concierge"
              className="w-11 h-11 -mt-4 rounded-2xl bg-gradient-to-br from-[#E50914] via-[#E50914] to-[#F5C518] flex items-center justify-center text-white font-black text-xl shadow-[0_6px_20px_rgba(229,9,20,0.6)] border-2 border-[#0A0A0B] hover:scale-105 transition-transform"
            >
              A
            </button>

            <button
              type="button"
              onClick={() => setRoute('search')}
              className={`flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-[10px] font-bold transition-colors ${
                route === 'search' ? 'text-[#F5C518]' : 'text-zinc-400 hover:text-white'
              }`}
            >
              <Search className="w-4 h-4" />
              <span>Search</span>
            </button>

            <button
              type="button"
              onClick={() => {
                setMyAnoraSection('hub');
                setRoute('my-anora');
              }}
              className={`flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-[10px] font-bold transition-colors ${
                route === 'my-anora' || route === 'watchlist'
                  ? 'text-[#F5C518]'
                  : 'text-zinc-400 hover:text-white'
              }`}
            >
              <span className="text-sm leading-none">{activeProfile.avatarEmoji}</span>
              <span>My Anora</span>
            </button>
          </div>
        </nav>

        {/* Global Modals */}
        <TrailerModal media={trailerMedia} onClose={() => setTrailerMedia(null)} />

        <RatingReviewModal
          media={ratingModalMedia}
          initialRating={
            ratingModalMedia
              ? activeProfile.ratings[
                  `${ratingModalMedia.media_type}-${ratingModalMedia.id}`
                ]?.rating || 9
              : 9
          }
          initialThumb={
            ratingModalMedia
              ? activeProfile.ratings[
                  `${ratingModalMedia.media_type}-${ratingModalMedia.id}`
                ]?.thumb || 'love'
              : 'love'
          }
          onSaveRating={(r, th) => {
            if (ratingModalMedia) handleSaveRating(ratingModalMedia, r, th);
          }}
          onSaveReview={(r, th, head, body, spoiler, epTag) => {
            if (ratingModalMedia) {
              handleSaveReview(ratingModalMedia, r, th, head, body, spoiler, epTag);
            }
          }}
          onClose={() => setRatingModalMedia(null)}
        />

        <ListPickerModal
          media={listModalMedia}
          lists={activeProfile.customLists}
          onToggleMediaInList={(listId, media) => {
            mutateActiveProfile((p) => ({
              ...p,
              customLists: p.customLists.map((l) => {
                if (l.id !== listId) return l;
                const exists = l.items.some(
                  (i) => i.mediaId === media.id && i.mediaType === media.media_type
                );
                return {
                  ...l,
                  items: exists
                    ? l.items.filter(
                        (i) =>
                          !(i.mediaId === media.id && i.mediaType === media.media_type)
                      )
                    : [
                        ...l.items,
                        {
                          mediaId: media.id,
                          mediaType: media.media_type,
                          title: media.title,
                          poster_path: media.poster_path,
                          year: media.year,
                          vote_average: media.vote_average,
                        },
                      ],
                };
              }),
            }));
            notify(`Updated custom list for "${media.title}"`);
          }}
          onCreateList={(name, description) => {
            mutateActiveProfile((p) => ({
              ...p,
              customLists: [
                {
                  id: `list_${Date.now()}`,
                  name,
                  description,
                  isPublic: true,
                  createdAt: new Date().toISOString(),
                  items: listModalMedia
                    ? [
                        {
                          mediaId: listModalMedia.id,
                          mediaType: listModalMedia.media_type,
                          title: listModalMedia.title,
                          poster_path: listModalMedia.poster_path,
                          year: listModalMedia.year,
                          vote_average: listModalMedia.vote_average,
                        },
                      ]
                    : [],
                },
                ...p.customLists,
              ],
            }));
            notify(`Created list "${name}"`);
          }}
          onClose={() => setListModalMedia(null)}
        />

        <CategoriesDrawerModal
          open={categoriesOpen}
          genres={GENRES}
          providers={STREAMING_PROVIDERS}
          selectedGenreId={selectedGenreId}
          selectedProviderId={selectedProviderId}
          onSelectGenre={(id) => {
            setSelectedGenreId(id);
            setRoute('home');
          }}
          onSelectProvider={(id) => {
            setSelectedProviderId(id);
            setRoute('home');
          }}
          onClose={() => setCategoriesOpen(false)}
        />

        <AiConciergeModal
          open={aiConciergeOpen}
          catalog={catalog}
          favoriteGenres={['Sci-Fi', 'Crime & Espionage', 'Prestige Drama']}
          hasLlmKey={Boolean(settings.llmApiKey.trim())}
          llmProvider={settings.llmProvider}
          onSelectMedia={handleSelectMedia}
          onClose={() => setAiConciergeOpen(false)}
        />

        {/* Toast Notification Banner */}
        {toastMessage && (
          <div
            role="status"
            className="fixed top-16 right-4 z-50 px-4 py-2.5 rounded-xl bg-[#141416] border border-[#F5C518] text-xs font-bold text-white shadow-2xl flex items-center gap-2"
          >
            <Sparkles className="w-4 h-4 text-[#F5C518]" />
            <span>{toastMessage}</span>
          </div>
        )}
      </div>
    </div>
  );
}


    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
